version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: biocom-mq-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - biocom-mq-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 3

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: biocom-mq-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - '8081:8081'
    networks:
      - biocom-mq-network
    depends_on:
      - redis

volumes:
  redis-data:
    driver: local

networks:
  biocom-mq-network:
    driver: bridge
