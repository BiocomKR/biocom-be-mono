# Service - biocom-mq Worker 네트워크 서비스 정의

apiVersion: v1
kind: Service
metadata:
  name: biocom-mq-service
  namespace: biocom-api
  labels:
    app: biocom-mq
    service: biocom-mq
spec:
  type: ClusterIP

  ports:
  - name: http
    port: 20804
    targetPort: 20804
    protocol: TCP

  selector:
    app: biocom-mq
