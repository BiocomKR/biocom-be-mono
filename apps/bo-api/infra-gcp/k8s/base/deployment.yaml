# Deployment - biocom-bo-api 배포 정의

apiVersion: apps/v1
kind: Deployment
metadata:
  name: biocom-bo-api
  namespace: biocom-bo-api
  labels:
    app: biocom-bo-api
    version: v1
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: biocom-bo-api
  template:
    metadata:
      labels:
        app: biocom-bo-api
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "10805"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: biocom-bo-api-sa

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000

      containers:
        - name: biocom-bo-api
          image: biocom-bo-api
          imagePullPolicy: Always

          ports:
            - containerPort: 10805
              name: http
              protocol: TCP

          envFrom:
            - configMapRef:
                name: biocom-bo-api-config
            - secretRef:
                name: biocom-bo-api-secrets

          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"

          startupProbe:
            httpGet:
              path: /api/health
              port: 10805
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /api/health
              port: 10805
            initialDelaySeconds: 0
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /api/health
              port: 10805
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          volumeMounts:
            - name: logs
              mountPath: /app/logs
            - name: logging-config
              mountPath: /app/config/logging
              readOnly: true
            - name: google-service-account-key
              mountPath: /app/secrets
              readOnly: true
            - name: firebase-service-account-key
              mountPath: /app/firebase
              readOnly: true

      volumes:
        - name: logs
          emptyDir: {}
        - name: logging-config
          configMap:
            name: biocom-bo-api-logging
        - name: google-service-account-key
          secret:
            secretName: google-service-account-key
        - name: firebase-service-account-key
          secret:
            secretName: firebase-service-account-key

      restartPolicy: Always

---
# HorizontalPodAutoscaler - 자동 스케일링
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: biocom-bo-api-hpa
  namespace: biocom-bo-api
  labels:
    app: biocom-bo-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: biocom-bo-api
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60

---
# ServiceAccount - Workload Identity용
apiVersion: v1
kind: ServiceAccount
metadata:
  name: biocom-bo-api-sa
  namespace: biocom-bo-api
  labels:
    app: biocom-bo-api
automountServiceAccountToken: true
