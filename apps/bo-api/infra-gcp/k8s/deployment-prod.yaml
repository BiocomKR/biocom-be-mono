# 🚀 Deployment - biocom-bo-api 운영 배포 정의
# dev 스펙의 2배 적용

apiVersion: apps/v1
kind: Deployment
metadata:
  name: biocom-bo-api
  namespace: biocom-bo-api
  labels:
    app: biocom-bo-api
    version: v1
    environment: prod
spec:
  replicas: 2  # dev: 1 → prod: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1          # 운영: 가용성 보장
      maxUnavailable: 0    # 운영: 다운타임 없음
  selector:
    matchLabels:
      app: biocom-bo-api
  template:
    metadata:
      labels:
        app: biocom-bo-api
        version: v1
        environment: prod
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "10805"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: biocom-bo-api-sa

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000

      # 운영 환경: 서로 다른 노드에 분산 배치
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - biocom-bo-api
                topologyKey: kubernetes.io/hostname

      containers:
        - name: biocom-bo-api
          image: asia-northeast3-docker.pkg.dev/api-prod-biocom/biocom-bo-api/biocom-bo-api:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 10805
              name: http
              protocol: TCP

          envFrom:
            - configMapRef:
                name: biocom-bo-api-config
            - secretRef:
                name: biocom-bo-api-secrets

          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

          # 리소스 제한 (dev의 2배)
          resources:
            requests:
              memory: "512Mi"   # dev: 256Mi → prod: 512Mi
              cpu: "200m"       # dev: 100m → prod: 200m
            limits:
              memory: "1Gi"     # dev: 512Mi → prod: 1Gi
              cpu: "500m"       # dev: 250m → prod: 500m

          # Startup probe
          startupProbe:
            httpGet:
              path: /api/health
              port: 10805
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
            successThreshold: 1

          # Liveness probe
          livenessProbe:
            httpGet:
              path: /api/health
              port: 10805
            initialDelaySeconds: 0
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

          # Readiness probe
          readinessProbe:
            httpGet:
              path: /api/health
              port: 10805
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          volumeMounts:
            - name: logs
              mountPath: /app/logs
            - name: logging-config
              mountPath: /app/config/logging
              readOnly: true
            - name: google-service-account-key
              mountPath: /app/secrets
              readOnly: true
            - name: firebase-service-account-key
              mountPath: /app/firebase
              readOnly: true

      volumes:
        - name: logs
          emptyDir: {}
        - name: logging-config
          configMap:
            name: biocom-bo-api-logging
        - name: google-service-account-key
          secret:
            secretName: google-service-account-key
        - name: firebase-service-account-key
          secret:
            secretName: firebase-service-account-key

      restartPolicy: Always

---
# 🔄 HorizontalPodAutoscaler - 자동 스케일링 (운영용)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: biocom-bo-api-hpa
  namespace: biocom-bo-api
  labels:
    app: biocom-bo-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: biocom-bo-api
  minReplicas: 2  # dev: 1 → prod: 2
  maxReplicas: 6  # dev: 3 → prod: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60

---
# 🔧 ServiceAccount - Workload Identity용 (운영)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: biocom-bo-api-sa
  namespace: biocom-bo-api
  labels:
    app: biocom-bo-api
  annotations:
    iam.gke.io/gcp-service-account: biocom-bo-api@api-prod-biocom.iam.gserviceaccount.com
automountServiceAccountToken: true
