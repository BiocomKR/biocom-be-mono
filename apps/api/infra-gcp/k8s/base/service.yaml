# 🌐 Service - 네트워크 서비스 정의

apiVersion: v1
kind: Service
metadata:
  name: biocom-api-service
  namespace: biocom-api
  labels:
    app: biocom-api
    service: biocom-api
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "biocom-api-backend-config"}'
    service.alpha.kubernetes.io/tolerate-unready-endpoints: "true"
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 10804
    protocol: TCP
  selector:
    app: biocom-api

---
# 🔄 Headless Service
apiVersion: v1
kind: Service
metadata:
  name: biocom-api-headless
  namespace: biocom-api
  labels:
    app: biocom-api
    service: biocom-api-headless
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: http
    port: 10804
    targetPort: 10804
    protocol: TCP
  selector:
    app: biocom-api
