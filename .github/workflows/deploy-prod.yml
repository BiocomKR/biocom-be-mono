# main 브랜치 merge → 운영서버 자동 배포
name: Deploy to Production

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: api-prod-biocom
  REGION: asia-northeast3
  REPOSITORY: biocom-api
  IMAGE_NAME: biocom-bo-api
  GKE_CLUSTER: biocom-cluster-prod
  GKE_ZONE: asia-northeast3-a
  NAMESPACE: biocom-bo-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_PROD }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build Docker Image
        run: |
          IMAGE_TAG=$(date +%Y%m%d%H%M%S)
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:$IMAGE_TAG .
          docker tag ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:$IMAGE_TAG \
                     ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Push Docker Image
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm ci

      - name: Setup Cloud SQL Proxy
        run: |
          curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.2/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy

      - name: Run DB Migration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD_PROXY }}
        run: |
          # Cloud SQL Proxy 백그라운드 실행
          ./cloud-sql-proxy --port 5432 ${{ env.PROJECT_ID }}:${{ env.REGION }}:biocom-postgres-prod &
          PROXY_PID=$!
          sleep 5

          # DB 마이그레이션 실행 (스키마 추가만 허용, 데이터 손실 발생 시 실패)
          npx prisma db push

          # Proxy 종료
          kill $PROXY_PID || true

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}

      - name: Update Deployment Image
        run: |
          cd infra-gcp/k8s
          sed -i "s|image: .*biocom-bo-api.*|image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}|" deployment-prod.yaml

      - name: Deploy to GKE
        run: |
          kubectl apply -f infra-gcp/k8s/configmap-prod.yaml -n ${{ env.NAMESPACE }}
          kubectl apply -f infra-gcp/k8s/service.yaml -n ${{ env.NAMESPACE }}
          kubectl apply -f infra-gcp/k8s/deployment-prod.yaml -n ${{ env.NAMESPACE }}
          kubectl apply -f infra-gcp/k8s/ingress-prod.yaml -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/biocom-bo-api -n ${{ env.NAMESPACE }} --timeout=300s

      - name: Verify Deployment
        run: |
          echo "Waiting for service to be ready..."
          sleep 10
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=biocom-bo-api

      - name: Notify Success
        if: success()
        run: echo "✅ 운영서버 배포 완료 - 태그:${{ env.IMAGE_TAG }}"

      - name: Notify Failure
        if: failure()
        run: echo "❌ 운영서버 배포 실패"
