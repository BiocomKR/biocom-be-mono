# main 브랜치 merge → 운영서버 자동 배포
name: Deploy to Production

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: api-prod-biocom
  REGION: asia-northeast3
  REPOSITORY: biocom-api
  IMAGE_NAME: biocom-api
  GKE_CLUSTER: ai-agent-cluster
  GKE_ZONE: asia-northeast3-a

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_PROD }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build Docker Image
        run: |
          IMAGE_TAG=$(date +%Y%m%d%H%M%S)
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:$IMAGE_TAG .
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Push Docker Image
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}

      - name: Update kustomization.yaml
        run: |
          cd infra-gcp/k8s/overlays/prod
          sed -i "s/newTag: .*/newTag: \"${{ env.IMAGE_TAG }}\"/" kustomization.yaml

      - name: Deploy to GKE
        run: |
          kubectl apply -k infra-gcp/k8s/overlays/prod/
          kubectl rollout status deployment/biocom-api -n biocom-api --timeout=300s

      - name: Notify Success
        if: success()
        run: echo "운영서버 배포 완료 - 태그:${{ env.IMAGE_TAG }}"

      - name: Notify Failure
        if: failure()
        run: echo "운영서버 배포 실패"
