# development 브랜치 push → 개발서버 자동 배포
name: Deploy to Development

on:
  push:
    branches:
      - development

env:
  PROJECT_ID: api-dev-biocom
  REGION: asia-northeast3
  REPOSITORY: biocom-api
  IMAGE_NAME: biocom-bo-api
  GKE_CLUSTER: cluster-api-dev
  GKE_ZONE: asia-northeast3-a
  NAMESPACE: biocom-bo-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_DEV }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # GKE 클러스터 존재 여부 사전 검증
      - name: Validate GKE Cluster
        run: |
          gcloud container clusters describe ${{ env.GKE_CLUSTER }} \
            --zone ${{ env.GKE_ZONE }} \
            --project ${{ env.PROJECT_ID }} \
            --format="value(name)" > /dev/null

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build Docker Image
        run: |
          IMAGE_TAG=$(date +%Y%m%d%H%M%S)
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:$IMAGE_TAG .
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Push Docker Image
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm ci

      - name: Setup Cloud SQL Proxy
        run: |
          curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.2/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy

      - name: Run DB Migration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DEV_PROXY }}
        run: |
          # Cloud SQL Proxy 백그라운드 실행
          ./cloud-sql-proxy --port 5432 ${{ env.PROJECT_ID }}:${{ env.REGION }}:biocom-postgres-dev &
          PROXY_PID=$!
          sleep 5

          # DB 마이그레이션 실행
          npx prisma db push --accept-data-loss

          # Proxy 종료
          kill $PROXY_PID || true

      - name: Update kustomization.yaml
        run: |
          cd infra-gcp/k8s/overlays/dev
          sed -i "s/newTag: .*/newTag: \"${{ env.IMAGE_TAG }}\"/" kustomization.yaml

      - name: Deploy to GKE
        run: |
          kubectl apply -k infra-gcp/k8s/overlays/dev/
          kubectl rollout status deployment/biocom-bo-api -n ${{ env.NAMESPACE }} --timeout=300s

      - name: Verify Deployment
        run: |
          echo "Waiting for service to be ready..."
          sleep 10
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=biocom-bo-api

      - name: Notify Success
        if: success()
        run: echo "개발서버 배포 완료 - 태그:${{ env.IMAGE_TAG }}"

      - name: Notify Failure
        if: failure()
        run: echo "개발서버 배포 실패"
