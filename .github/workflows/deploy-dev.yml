# development 브랜치 push → 개발서버 자동 배포
name: Deploy to Development

on:
  push:
    branches:
      - development

env:
  PROJECT_ID: api-dev-biocom
  REGION: asia-northeast3
  REPOSITORY: biocom-api
  IMAGE_NAME: biocom-mq
  GKE_CLUSTER: biocom-cluster-dev
  GKE_ZONE: asia-northeast3-a
  NAMESPACE: biocom-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_DEV }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build Docker Image
        run: |
          IMAGE_TAG=$(date +%Y%m%d%H%M%S)
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:$IMAGE_TAG .
          docker tag ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:$IMAGE_TAG \
                     ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Push Docker Image
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm ci

      - name: Run DB Migration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DEV }}
        run: npx prisma db push --accept-data-loss

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}

      - name: Update Deployment Image
        run: |
          cd infra-gcp/k8s
          sed -i "s|image: .*biocom-mq.*|image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}|" deployment.yaml

      - name: Deploy to GKE
        run: |
          kubectl apply -f infra-gcp/k8s/configmap-dev.yaml -n ${{ env.NAMESPACE }}
          kubectl apply -f infra-gcp/k8s/service.yaml -n ${{ env.NAMESPACE }}
          kubectl apply -f infra-gcp/k8s/deployment.yaml -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/biocom-mq -n ${{ env.NAMESPACE }} --timeout=300s

      - name: Verify Deployment
        run: |
          echo "Waiting for pods to be ready..."
          sleep 10
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=biocom-mq

      - name: Notify Success
        if: success()
        run: echo "✅ biocom-mq 개발서버 배포 완료 - 태그:${{ env.IMAGE_TAG }}"

      - name: Notify Failure
        if: failure()
        run: echo "❌ biocom-mq 개발서버 배포 실패"
