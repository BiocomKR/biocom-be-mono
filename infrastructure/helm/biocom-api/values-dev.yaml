# 개발 환경 오버라이드 값

# Pod 복제본 수 (개발환경: 노드 1개이므로 최소한으로)
replicaCount: 1

# 컨테이너 리소스 제한 (개발환경은 작게 설정)
resources:
  limits:
    cpu: 100m      # CPU 최대 사용량 (개발용 최소화)
    memory: 256Mi  # 메모리 최대 사용량 (개발용 최소화)
  requests:
    cpu: 50m       # CPU 최소 보장량
    memory: 128Mi  # 메모리 최소 보장량

# HPA(Horizontal Pod Autoscaler) 설정 - 부하에 따른 자동 스케일링
autoscaling:
  enabled: true                          # 오토스케일링 활성화
  minReplicas: 1                        # 최소 Pod 수 (개발환경)
  maxReplicas: 10                       # 최대 Pod 수 (부하시 확장 한계)
  targetCPUUtilizationPercentage: 70    # CPU 70% 초과시 스케일 아웃
  targetMemoryUtilizationPercentage: 80 # 메모리 80% 초과시 스케일 아웃

env:
  - name: NODE_ENV
    value: development
  - name: PORT
    value: "3000"
  - name: LOG_LEVEL
    value: debug
  - name: RATE_LIMIT_TTL
    value: "60"
  - name: RATE_LIMIT_LIMIT
    value: "1000"
  - name: UPLOAD_PATH
    value: "/app/uploads"

probes:
  liveness:
    enabled: true
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3
  readiness:
    enabled: true
    httpGet:
      path: /api/health
      port: 3000

# PVC 설정 (EBS CSI 드라이버 설치 완료)
persistence:
  enabled: true
  storageClass: gp3

# 개발 환경 HTTPS 설정 오버라이드 없음 (기본 values.yaml 사용)

