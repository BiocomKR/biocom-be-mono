# 개발 환경 오버라이드 값

# Pod 복제본 수 (노드 2개 × 각 2개 = 총 4개)
replicaCount: 4

# 컨테이너 리소스 제한 (개발환경은 작게 설정)
resources:
  limits:
    cpu: 200m      # CPU 최대 사용량
    memory: 512Mi  # 메모리 최대 사용량
  requests:
    cpu: 100m      # CPU 최소 보장량
    memory: 256Mi  # 메모리 최소 보장량

# HPA(Horizontal Pod Autoscaler) 설정 - 부하에 따른 자동 스케일링
autoscaling:
  enabled: true                          # 오토스케일링 활성화
  minReplicas: 4                        # 최소 Pod 수 (기본값)
  maxReplicas: 10                       # 최대 Pod 수 (부하시 확장 한계)
  targetCPUUtilizationPercentage: 70    # CPU 70% 초과시 스케일 아웃
  targetMemoryUtilizationPercentage: 80 # 메모리 80% 초과시 스케일 아웃

env:
  - name: NODE_ENV
    value: development
  - name: PORT
    value: "3000"
  - name: LOG_LEVEL
    value: debug
  - name: RATE_LIMIT_TTL
    value: "60"
  - name: RATE_LIMIT_LIMIT
    value: "1000"

probes:
  liveness:
    enabled: true
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3
  readiness:
    enabled: true
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3

