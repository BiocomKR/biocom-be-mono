# 🔐 Secret - 민감한 정보 관리
# 실제 운영에서는 Secret Manager나 External Secrets Operator 사용 권장

apiVersion: v1
kind: Secret
metadata:
  name: biocom-api-secrets
  namespace: biocom-api
  labels:
    app: biocom-api
    environment: dev
type: Opaque
stringData:
  # ⚠️ 실제 운영에서는 이 값들을 Secret Manager에서 가져와야 함
  # 현재는 예시용 더미 값
  
  # 데이터베이스 패스워드
  DB_PASSWORD: "REPLACE_WITH_ACTUAL_PASSWORD"
  
  # JWT 비밀키
  JWT_SECRET: "REPLACE_WITH_ACTUAL_JWT_SECRET"
  JWT_REFRESH_SECRET: "REPLACE_WITH_ACTUAL_REFRESH_SECRET"
  
  # ImWeb API 키
  IMWEB_API_KEY: "REPLACE_WITH_ACTUAL_IMWEB_API_KEY"
  IMWEB_API_SECRET: "REPLACE_WITH_ACTUAL_IMWEB_API_SECRET"
  
  # 기타 비밀키
  ENCRYPTION_KEY: "REPLACE_WITH_ACTUAL_ENCRYPTION_KEY"
  
---
# 🔑 Service Account Secret (Cloud SQL Proxy용)
# Cloud SQL Proxy가 Cloud SQL에 접속하기 위한 서비스 계정 키
apiVersion: v1
kind: Secret
metadata:
  name: cloudsql-instance-credentials
  namespace: biocom-api
  labels:
    app: biocom-api
    component: cloudsql-proxy
type: Opaque
data:
  # 실제 서비스 계정 키 JSON을 base64로 인코딩해서 입력
  # gcloud iam service-accounts keys create key.json --iam-account=SERVICE_ACCOUNT_EMAIL
  # cat key.json | base64 -w 0
  credentials.json: "REPLACE_WITH_BASE64_ENCODED_SERVICE_ACCOUNT_KEY"

---
# 📋 Secret 사용 가이드
# 
# 🔒 운영환경에서 Secret 관리 방법:
# 
# 1. Google Secret Manager 사용 (권장):
#    - terraform으로 Secret Manager에 비밀값 저장
#    - External Secrets Operator로 K8s Secret과 동기화
#    - 값 변경 시 자동으로 Pod 재시작
# 
# 2. Workload Identity 사용:
#    - Pod가 서비스 계정을 통해 GCP 서비스에 안전하게 접근
#    - 서비스 계정 키 파일 불필요
# 
# 3. Sealed Secrets 사용:
#    - 암호화된 Secret을 Git에 안전하게 저장
#    - 클러스터에서만 복호화 가능
# 
# 🛠️ 실제 Secret 적용 방법:
# 
# 1. Secret Manager에서 값 가져오기:
#    kubectl create secret generic biocom-api-secrets \
#      --from-literal=DB_PASSWORD="$(gcloud secrets versions access latest --secret=biocom-db-password)" \
#      --from-literal=JWT_SECRET="$(gcloud secrets versions access latest --secret=biocom-jwt-secret)" \
#      -n biocom-api
# 
# 2. 서비스 계정 키 생성 및 적용:
#    gcloud iam service-accounts create cloudsql-proxy \
#      --display-name="Cloud SQL Proxy Service Account"
#    
#    gcloud projects add-iam-policy-binding PROJECT_ID \
#      --member="serviceAccount:cloudsql-proxy@PROJECT_ID.iam.gserviceaccount.com" \
#      --role="roles/cloudsql.client"
#    
#    gcloud iam service-accounts keys create key.json \
#      --iam-account=cloudsql-proxy@PROJECT_ID.iam.gserviceaccount.com
#    
#    kubectl create secret generic cloudsql-instance-credentials \
#      --from-file=credentials.json=key.json -n biocom-api