# 🕐 CronJob - 챌린지 활성화 배치
# 매주 월요일 00:05 KST에 실행

apiVersion: batch/v1
kind: CronJob
metadata:
  name: activate-challenges
  namespace: biocom-api
  labels:
    app: biocom-api
    job-type: activate-challenges
spec:
  # Cron 표현식 (UTC 기준 - KST 00:05 = UTC 15:05, 월요일)
  # 월요일: 1 (일요일=0, 월요일=1)
  # KST 00:05 월요일 = UTC 15:05 일요일
  schedule: "5 15 * * 0"

  # 성공한 Job 히스토리 보관 개수
  successfulJobsHistoryLimit: 3

  # 실패한 Job 히스토리 보관 개수
  failedJobsHistoryLimit: 3

  # 동시 실행 정책
  concurrencyPolicy: Forbid

  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600

      template:
        metadata:
          labels:
            app: biocom-api
            job-type: activate-challenges
        spec:
          serviceAccountName: biocom-api-sa

          imagePullSecrets:
          - name: gcr-json-key

          restartPolicy: Never

          containers:
          - name: activate-challenges
            image: asia-northeast3-docker.pkg.dev/api-dev-biocom/biocom-api/biocom-api:20251224225323
            imagePullPolicy: Always

            command:
            - node
            - dist/src/main.js
            - --run-scheduler
            - activate-challenges

            envFrom:
            - configMapRef:
                name: biocom-api-config
            - secretRef:
                name: biocom-api-secrets

            volumeMounts:
            - name: logs
              mountPath: /app/logs
            - name: kcp-cert-files
              mountPath: /config/kcp-cert
              readOnly: true
            - name: firebase-service-account-key
              mountPath: /app/firebase
              readOnly: true

            resources:
              requests:
                memory: "512Mi"
                cpu: "250m"
              limits:
                memory: "1Gi"
                cpu: "500m"

          volumes:
          - name: logs
            emptyDir: {}
          - name: kcp-cert-files
            secret:
              secretName: kcp-cert-files
          - name: firebase-service-account-key
            secret:
              secretName: firebase-service-account-key
