# 🕐 CronJob - 챌린지 만료 처리 배치
# 매일 자정(00:00 KST)에 실행

apiVersion: batch/v1
kind: CronJob
metadata:
  name: expire-challenges
  namespace: biocom-api
  labels:
    app: biocom-api
    job-type: expire-challenges
spec:
  # Cron 표현식 (UTC 기준 - KST 00:00 = UTC 15:00)
  # KST는 UTC+9 이므로 00:00 KST = 15:00 UTC (전날)
  schedule: "0 15 * * *"

  # 성공한 Job 히스토리 보관 개수
  successfulJobsHistoryLimit: 3

  # 실패한 Job 히스토리 보관 개수
  failedJobsHistoryLimit: 3

  # 동시 실행 정책 (Forbid: 이전 작업이 끝나기 전까지 새 작업 시작 안 함)
  concurrencyPolicy: Forbid

  jobTemplate:
    spec:
      # Job 완료 후 Pod 삭제까지 대기 시간 (초)
      ttlSecondsAfterFinished: 3600

      template:
        metadata:
          labels:
            app: biocom-api
            job-type: expire-challenges
        spec:
          # 서비스 계정
          serviceAccountName: biocom-api-sa

          # 이미지 Pull Secret
          imagePullSecrets:
          - name: gcr-json-key

          # Job 실패 시 재시작하지 않음
          restartPolicy: Never

          containers:
          - name: expire-challenges
            image: asia-northeast3-docker.pkg.dev/api-dev-biocom/biocom-api/biocom-api:20251224225323
            imagePullPolicy: Always

            # 배치 실행 명령어
            command:
            - node
            - dist/src/main.js
            - --run-scheduler
            - expire-challenges

            # 환경변수는 ConfigMap + Secret에서 가져옴
            envFrom:
            - configMapRef:
                name: biocom-api-config
            - secretRef:
                name: biocom-api-secrets

            volumeMounts:
            - name: logs
              mountPath: /app/logs
            - name: kcp-cert-files
              mountPath: /config/kcp-cert
            - name: firebase-service-account-key
              mountPath: /app/firebase
              readOnly: true
              readOnly: true

            # 리소스 제한
            resources:
              requests:
                memory: "512Mi"
                cpu: "250m"
              limits:
                memory: "1Gi"
                cpu: "500m"

          volumes:
          - name: logs
            emptyDir: {}
          - name: kcp-cert-files
            secret:
              secretName: kcp-cert-files
          - name: firebase-service-account-key
            secret:
              secretName: firebase-service-account-key
