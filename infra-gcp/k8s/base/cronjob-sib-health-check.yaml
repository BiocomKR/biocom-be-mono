# 🩺 CronJob - SIB API 헬스체크
# 1분마다 실행, 3회 재시도 후 실패 시 슬랙 알림

apiVersion: batch/v1
kind: CronJob
metadata:
  name: sib-health-check
  namespace: biocom-api
  labels:
    app: biocom-api
    job-type: sib-health-check
spec:
  # Cron 표현식 (1분마다 실행)
  schedule: "* * * * *"

  # 성공한 Job 히스토리 보관 개수
  successfulJobsHistoryLimit: 3

  # 실패한 Job 히스토리 보관 개수
  failedJobsHistoryLimit: 3

  # 동시 실행 정책 (Forbid: 이전 작업이 끝나기 전까지 새 작업 시작 안 함)
  concurrencyPolicy: Forbid

  jobTemplate:
    spec:
      # Job 완료 후 Pod 삭제까지 대기 시간 (초)
      ttlSecondsAfterFinished: 300

      template:
        metadata:
          labels:
            app: biocom-api
            job-type: sib-health-check
        spec:
          # 서비스 계정
          serviceAccountName: biocom-api-sa

          # 이미지 Pull Secret
          imagePullSecrets:
          - name: gcr-json-key

          # Job 실패 시 재시작하지 않음
          restartPolicy: Never

          containers:
          - name: sib-health-check
            image: biocom-api
            imagePullPolicy: Always

            # 배치 실행 명령어 (DATABASE_URL 조합 후 실행)
            command: ["/bin/sh", "-c"]
            args:
            - |
              ENCODED_PASSWORD=$(node -e "console.log(encodeURIComponent(process.env.DB_PASSWORD))")
              export DATABASE_URL="postgresql://${DB_USERNAME}:${ENCODED_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?${DATABASE_URL_OPTIONS}"
              echo "DATABASE_URL configured"
              exec node dist/src/main.js --run-scheduler sib-health-check

            # 환경변수는 ConfigMap + Secret에서 가져옴
            envFrom:
            - configMapRef:
                name: biocom-api-config
            - secretRef:
                name: biocom-api-secrets

            volumeMounts:
            - name: logs
              mountPath: /app/logs
            - name: kcp-cert-files
              mountPath: /config/kcp-cert
            - name: firebase-service-account-key
              mountPath: /app/firebase

            # 리소스 제한 (헬스체크는 가벼운 작업)
            resources:
              requests:
                memory: "128Mi"
                cpu: "50m"
              limits:
                memory: "256Mi"
                cpu: "100m"

          volumes:
          - name: logs
            emptyDir: {}
          - name: kcp-cert-files
            secret:
              secretName: kcp-cert-files
          - name: firebase-service-account-key
            secret:
              secretName: firebase-service-account-key
