# 🚀 Deployment - 애플리케이션 배포 정의
# Kustomize로 환경별 이미지 태그 관리

apiVersion: apps/v1
kind: Deployment
metadata:
  name: biocom-api
  namespace: biocom-api
  labels:
    app: biocom-api
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: biocom-api
  template:
    metadata:
      labels:
        app: biocom-api
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "10804"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: biocom-api-sa
      imagePullSecrets:
      - name: gcr-json-key
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000

      containers:
      - name: biocom-api
        # 이미지는 Kustomize로 오버라이드됨
        image: biocom-api
        imagePullPolicy: Always

        # DATABASE_URL을 환경변수에서 동적으로 조합하여 시작
        # DB_PASSWORD의 특수문자(@, #, ! 등)를 URL 인코딩 처리 (node 사용)
        command: ["/bin/sh", "-c"]
        args:
          - |
            ENCODED_PASSWORD=$(node -e "console.log(encodeURIComponent(process.env.DB_PASSWORD))")
            export DATABASE_URL="postgresql://${DB_USERNAME}:${ENCODED_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?${DATABASE_URL_OPTIONS}"
            echo "DATABASE_URL configured (password hidden)"
            exec node dist/src/main.js

        ports:
        - containerPort: 10804
          name: http
          protocol: TCP

        envFrom:
        - configMapRef:
            name: biocom-api-config
        - secretRef:
            name: biocom-api-secrets

        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName

        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"

        startupProbe:
          httpGet:
            path: /api/health
            port: 10804
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
          successThreshold: 1

        livenessProbe:
          httpGet:
            path: /api/health
            port: 10804
          initialDelaySeconds: 0
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /api/health
            port: 10804
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        volumeMounts:
        - name: logs
          mountPath: /app/logs
        - name: logging-config
          mountPath: /app/config/logging
          readOnly: true
        - name: google-service-account-key
          mountPath: /app/secrets
          readOnly: true
        - name: kcp-cert-files
          mountPath: /config/kcp-cert
          readOnly: true
        - name: firebase-service-account-key
          mountPath: /app/firebase
          readOnly: true

      volumes:
      - name: logs
        emptyDir: {}
      - name: logging-config
        configMap:
          name: biocom-api-logging
      - name: google-service-account-key
        secret:
          secretName: google-service-account-key
      - name: kcp-cert-files
        secret:
          secretName: kcp-cert-files
      - name: firebase-service-account-key
        secret:
          secretName: firebase-service-account-key

      restartPolicy: Always

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - biocom-api
              topologyKey: kubernetes.io/hostname

---
# 🔄 HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: biocom-api-hpa
  namespace: biocom-api
  labels:
    app: biocom-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: biocom-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60

---
# 🔧 ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: biocom-api-sa
  namespace: biocom-api
  labels:
    app: biocom-api
  annotations:
    iam.gke.io/gcp-service-account: biocom-api@biocom-api-dev.iam.gserviceaccount.com
automountServiceAccountToken: true
