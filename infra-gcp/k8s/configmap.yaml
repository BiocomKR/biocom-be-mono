# ⚙️ ConfigMap - biocom-bo-api 설정
# biocom-api와 동일한 DB/Storage 사용

apiVersion: v1
kind: ConfigMap
metadata:
  name: biocom-bo-api-config
  namespace: biocom-bo-api
  labels:
    app: biocom-bo-api
    environment: dev
data:
  # 데이터베이스 설정 (biocom-api와 동일한 DB 공유)
  DB_HOST: "34.47.124.132"
  DB_PORT: "5432"
  DB_NAME: "biocom"
  DB_USERNAME: "biocom"
  DATABASE_URL: "postgresql://biocom:bico0825%21%40%23@34.47.124.132:5432/biocom?connection_limit=5&pool_timeout=30&connect_timeout=10"

  # 애플리케이션 설정
  NODE_ENV: "production"
  PORT: "10805"  # biocom-api는 10804

  # API 설정
  API_PREFIX: "/api"
  SWAGGER_PATH: "/docs"

  # 로깅 설정
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"

  # CORS 설정 (백오피스 FE 도메인)
  CORS_ORIGIN: "https://bo-dev.biocom.ai.kr"

  # JWT 설정
  JWT_ACCESS_TOKEN_EXPIRES_IN: "3h"
  JWT_REFRESH_TOKEN_EXPIRES_IN: "180d"

  # Google Cloud Storage 설정 (biocom-api와 동일한 버킷 공유)
  GOOGLE_CLOUD_PROJECT_ID: "api-dev-biocom"
  GCS_BUCKET_NAME: "api-dev-biocom-uploads"
  GOOGLE_APPLICATION_CREDENTIALS: "/app/secrets/key.json"

  # Firebase 설정
  FIREBASE_SERVICE_ACCOUNT_PATH: "/app/firebase/firebase-key.json"

  # 파일 업로드 설정
  MAX_FILE_SIZE: "10485760"
  ALLOWED_FILE_TYPES: "image/jpeg,image/png,image/gif,application/pdf"

  # Rate Limiting 설정 (백오피스는 더 관대하게)
  RATE_LIMIT_TTL: "60"
  RATE_LIMIT_LIMIT: "200"

  # 기타 설정
  TIMEZONE: "Asia/Seoul"

---
# 📝 로깅 설정용 ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: biocom-bo-api-logging
  namespace: biocom-bo-api
  labels:
    app: biocom-bo-api
    component: logging
data:
  logging.json: |
    {
      "level": "info",
      "format": "json",
      "timestamp": true,
      "colorize": false,
      "metadata": true,
      "fields": {
        "service": "biocom-bo-api",
        "environment": "dev",
        "version": "1.0.0"
      }
    }
