# ⚙️ ConfigMap - biocom-mq Worker 설정 관리

apiVersion: v1
kind: ConfigMap
metadata:
  name: biocom-mq-config
  namespace: biocom-api
  labels:
    app: biocom-mq
    environment: dev
data:
  # 애플리케이션 설정
  NODE_ENV: "production"
  PORT: "20804"
  LOG_LEVEL: "info"

  # Redis 설정 (BullMQ Queue)
  REDIS_HOST: "10.213.120.195"
  REDIS_PORT: "6379"

  # Firebase 설정 (FCM 푸시용)
  FIREBASE_SERVICE_ACCOUNT_PATH: "/app/firebase/firebase-key.json"

  # Bull Board 설정
  BULL_BOARD_ENABLED: "true"
  BULL_BOARD_PATH: "/admin/queues"

  # 기타 설정
  TIMEZONE: "Asia/Seoul"
