# 🚀 Deployment - 애플리케이션 배포 정의
# AWS EKS Deployment와 동일한 기능

apiVersion: apps/v1
kind: Deployment
metadata:
  name: biocom-api
  namespace: biocom-api
  labels:
    app: biocom-api
    version: v1
    environment: dev
spec:
  replicas: 2  # Pod 개수 (AWS EKS와 동일)
  selector:
    matchLabels:
      app: biocom-api
  template:
    metadata:
      labels:
        app: biocom-api
        version: v1
      annotations:
        # Prometheus 메트릭 수집을 위한 어노테이션
        prometheus.io/scrape: "true"
        prometheus.io/port: "10804"
        prometheus.io/path: "/metrics"
    spec:
      # 서비스 계정 (Workload Identity용)
      serviceAccountName: biocom-api-sa
      
      # 이미지 Pull Secret (Artifact Registry 접근용)
      imagePullSecrets:
      - name: gcr-json-key
      
      # Pod 보안 설정
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000
      
      containers:
      # 메인 애플리케이션 컨테이너
      - name: biocom-api
        image: asia-northeast3-docker.pkg.dev/biocom-api-dev/biocom-api/biocom-api:latest
        imagePullPolicy: Always
        
        ports:
        - containerPort: 10804
          name: http
          protocol: TCP
        
        # 환경 변수 (ConfigMap에서 가져오기)
        envFrom:
        - configMapRef:
            name: biocom-api-config
        - secretRef:
            name: biocom-api-secrets
        
        # 추가 환경 변수
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        
        # 리소스 제한 (AWS EKS와 동일한 개념)
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        
        # 헬스체크 설정
        livenessProbe:
          httpGet:
            path: /api/health
            port: 10804
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /api/health
            port: 10804
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        
        # 볼륨 마운트
        volumeMounts:
        - name: logs
          mountPath: /app/logs
        - name: logging-config
          mountPath: /app/config/logging
          readOnly: true
      
      # Cloud SQL Proxy 사이드카 컨테이너 (Workload Identity 사용 시 제거)
      # GKE는 Private IP로 직접 연결 가능
      # - name: cloudsql-proxy
      #   image: gcr.io/cloudsql-docker/gce-proxy:1.35.0-alpine
      #   command:
      #     - "/cloud_sql_proxy"
      #     - "-instances=PROJECT_ID:asia-northeast3:biocom-postgres=tcp:5432"
      #     - "-credential_file=/secrets/cloudsql/credentials.json"
      
      # 볼륨 정의
      volumes:
      - name: logs
        emptyDir: {}
      - name: logging-config
        configMap:
          name: biocom-api-logging
      # Cloud SQL credentials (Workload Identity 사용 시 불필요)
      # - name: cloudsql-instance-credentials
      #   secret:
      #     secretName: cloudsql-instance-credentials
      
      # Pod 재시작 정책
      restartPolicy: Always
      
      # 노드 선택 (필요한 경우)
      # nodeSelector:
      #   cloud.google.com/gke-nodepool: app-nodes
      
      # Pod 분산 정책 (고가용성)
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - biocom-api
              topologyKey: kubernetes.io/hostname

---
# 🔄 HorizontalPodAutoscaler - 자동 스케일링
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: biocom-api-hpa
  namespace: biocom-api
  labels:
    app: biocom-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: biocom-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # 5분 안정화
      policies:
      - type: Percent
        value: 50  # 한 번에 50%까지 줄이기
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60   # 1분 안정화
      policies:
      - type: Percent
        value: 100  # 한 번에 2배까지 늘리기
        periodSeconds: 60

---
# 🔧 ServiceAccount - Workload Identity용
apiVersion: v1
kind: ServiceAccount
metadata:
  name: biocom-api-sa
  namespace: biocom-api
  labels:
    app: biocom-api
  annotations:
    # Workload Identity 어노테이션 (실제 GSA 이메일로 교체)
    iam.gke.io/gcp-service-account: biocom-api@biocom-api-dev.iam.gserviceaccount.com
automountServiceAccountToken: true