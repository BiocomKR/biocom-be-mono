# 🚀 Deployment - biocom-bo-api 배포 정의
# 경량화된 백오피스 API 스펙

apiVersion: apps/v1
kind: Deployment
metadata:
  name: biocom-bo-api
  namespace: biocom-bo-api
  labels:
    app: biocom-bo-api
    version: v1
    environment: dev
spec:
  replicas: 1  # 백오피스는 1개로 충분
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0          # 추가 Pod 없이 배포 (메모리 절약)
      maxUnavailable: 1    # 기존 Pod 먼저 종료 후 새 Pod 생성
  selector:
    matchLabels:
      app: biocom-bo-api
  template:
    metadata:
      labels:
        app: biocom-bo-api
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "10805"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: biocom-bo-api-sa

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000

      containers:
        - name: biocom-bo-api
          # TODO: 실제 이미지 태그로 변경
          image: asia-northeast3-docker.pkg.dev/api-dev-biocom/biocom-api/biocom-bo-api:20251222164635
          imagePullPolicy: Always

          ports:
            - containerPort: 10805
              name: http
              protocol: TCP

          envFrom:
            - configMapRef:
                name: biocom-bo-api-config
            - secretRef:
                name: biocom-bo-api-secrets

          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

          # 리소스 제한 (경량화)
          resources:
            requests:
              memory: "256Mi"  # biocom-api는 512Mi
              cpu: "100m"      # biocom-api는 250m
            limits:
              memory: "512Mi"  # biocom-api는 1Gi
              cpu: "250m"      # biocom-api는 500m

          # Startup probe
          startupProbe:
            httpGet:
              path: /api/health
              port: 10805
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
            successThreshold: 1

          # Liveness probe
          livenessProbe:
            httpGet:
              path: /api/health
              port: 10805
            initialDelaySeconds: 0
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

          # Readiness probe
          readinessProbe:
            httpGet:
              path: /api/health
              port: 10805
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          volumeMounts:
            - name: logs
              mountPath: /app/logs
            - name: logging-config
              mountPath: /app/config/logging
              readOnly: true
            - name: google-service-account-key
              mountPath: /app/secrets
              readOnly: true
            - name: firebase-service-account-key
              mountPath: /app/firebase
              readOnly: true

      volumes:
        - name: logs
          emptyDir: {}
        - name: logging-config
          configMap:
            name: biocom-bo-api-logging
        - name: google-service-account-key
          secret:
            secretName: google-service-account-key
        - name: firebase-service-account-key
          secret:
            secretName: firebase-service-account-key

      restartPolicy: Always

---
# 🔄 HorizontalPodAutoscaler - 자동 스케일링 (경량화)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: biocom-bo-api-hpa
  namespace: biocom-bo-api
  labels:
    app: biocom-bo-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: biocom-bo-api
  minReplicas: 1  # biocom-api는 2
  maxReplicas: 3  # biocom-api는 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60

---
# 🔧 ServiceAccount - Workload Identity용
apiVersion: v1
kind: ServiceAccount
metadata:
  name: biocom-bo-api-sa
  namespace: biocom-bo-api
  labels:
    app: biocom-bo-api
  annotations:
    iam.gke.io/gcp-service-account: biocom-bo-api@biocom-backoffice.iam.gserviceaccount.com
automountServiceAccountToken: true
