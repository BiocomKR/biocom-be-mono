# ⚙️ ConfigMap - biocom-mq Worker 설정 관리 (운영)

apiVersion: v1
kind: ConfigMap
metadata:
  name: biocom-mq-config
  namespace: biocom-api
  labels:
    app: biocom-mq
    environment: prod
data:
  # 애플리케이션 설정
  NODE_ENV: "production"
  PORT: "20804"
  LOG_LEVEL: "info"

  # 데이터베이스 설정 (운영 Cloud SQL - Private IP 사용)
  DATABASE_URL: "postgresql://biocom:qkdldhzjaProdelql0519@10.83.0.4:5432/biocom?connection_limit=5&pool_timeout=30&connect_timeout=10"

  # Redis 설정 (BullMQ Queue)
  REDIS_HOST: "redis-master"
  REDIS_PORT: "6379"

  # Firebase 설정 (FCM 푸시용 - Dev/Prod 앱 동시 지원)
  FIREBASE_DEV_CREDENTIAL_PATH: "/app/firebase/firebase-dev-key.json"
  FIREBASE_PROD_CREDENTIAL_PATH: "/app/firebase/firebase-prod-key.json"

  # Bull Board 설정
  BULL_BOARD_ENABLED: "true"
  BULL_BOARD_PATH: "/admin/queues"

  # 기타 설정
  TIMEZONE: "Asia/Seoul"
