# ⚙️ ConfigMap - 개발 환경 설정
# DEV 환경 전용 설정값

apiVersion: v1
kind: ConfigMap
metadata:
  name: biocom-api-config
  namespace: biocom-api
  labels:
    app: biocom-api
    environment: dev
data:
  # ==========================================
  # 데이터베이스 설정
  # ==========================================
  # Private IP 사용 (VPC 내부 통신, 오토스케일링 대응)
  # Public IP: 34.47.124.132 (로컬 개발용으로 유지)
  DB_HOST: "10.193.0.3"
  DB_PORT: "5432"
  DB_NAME: "biocom"
  DB_USERNAME: "biocom"
  # DATABASE_URL은 Deployment에서 Secret의 DB_PASSWORD와 조합하여 생성됨
  DATABASE_URL_OPTIONS: "connection_limit=5&pool_timeout=30&connect_timeout=10"

  # ==========================================
  # 애플리케이션 설정
  # ==========================================
  NODE_ENV: "dev"
  PORT: "10804"

  # ==========================================
  # API 설정
  # ==========================================
  API_PREFIX: "/api"
  SWAGGER_PATH: "/docs"

  # ==========================================
  # 로깅 설정
  # ==========================================
  LOG_LEVEL: "debug"
  LOG_FORMAT: "json"

  # ==========================================
  # ImWeb API 설정
  # ==========================================
  IMWEB_API_BASE_URL: "https://api.imweb.me"
  IMWEB_REDIRECT_URI: "https://api-dev.biocom.ai.kr/auth/redirect"

  # ==========================================
  # CORS 설정
  # ==========================================
  CORS_ORIGIN: "*"

  # ==========================================
  # JWT 설정
  # ==========================================
  JWT_ACCESS_TOKEN_EXPIRES_IN: "3h"
  JWT_REFRESH_TOKEN_EXPIRES_IN: "180d"

  # ==========================================
  # 토스페이먼츠 결제 설정 (테스트 키)
  # ==========================================
  TOSS_PAYMENTS_CLIENT_KEY: "test_ck_d46qopOB89POOvXxk1EarZmM75y0"

  # ==========================================
  # Google Cloud Storage 설정
  # ==========================================
  GOOGLE_CLOUD_PROJECT_ID: "api-dev-biocom"
  GCS_BUCKET_NAME: "api-dev-biocom-uploads"
  GOOGLE_APPLICATION_CREDENTIALS: "/app/secrets/key.json"

  # ==========================================
  # Firebase 설정
  # ==========================================
  FIREBASE_SERVICE_ACCOUNT_PATH: "/app/firebase/firebase-key.json"

  # ==========================================
  # Slack 알림 설정
  # ==========================================
  SLACK_NOTIFICATION_ENABLED: "true"

  # ==========================================
  # 파일 업로드 설정
  # ==========================================
  MAX_FILE_SIZE: "10485760"
  ALLOWED_FILE_TYPES: "image/jpeg,image/png,image/gif,application/pdf"

  # ==========================================
  # Rate Limiting 설정
  # ==========================================
  RATE_LIMIT_TTL: "60"
  RATE_LIMIT_LIMIT: "100"

  # ==========================================
  # 기타 설정
  # ==========================================
  TIMEZONE: "Asia/Seoul"

  # ==========================================
  # AI 모델 설정
  # ==========================================
  OPENAI_MODEL: "gpt-4o"
  AI_ANALYSIS_TIMEOUT: "30000"
  GEMINI_MODEL: "gemini-2.5-flash-image"
  FACE_SLIMMING_TIMEOUT: "60000"

  # ==========================================
  # 플레이오토 물류 API 설정
  # ==========================================
  PLAYAUTO_BASE_URL: "https://openapi.playauto.io/api"
  PLAYAUTO_SHOP_CD: "ULPL"
  PLAYAUTO_SHOP_ID: "biocom@biocom.kr"

  # ==========================================
  # NHN KCP 휴대폰 본인인증 설정
  # ==========================================
  KCP_SITE_CODE: "ALDXX"
  KCP_WEB_SITE_ID: "J25091911744"
  KCP_CERT_INFO: "/config/kcp-cert/KCP_AUTH_ALDXX_CERT.pem"
  KCP_PRIVATE_KEY_PATH: "/config/kcp-cert/KCP_AUTH_ALDXX_PRIKEY.pem"
  KCP_CALLBACK_NUMBER: "0220390295"

  # ==========================================
  # AI Agent 서버 설정
  # ==========================================
  AI_AGENT_BASE_URL: "https://ai-agent-dev.biocom.ai.kr"

---
# 📝 로깅 설정용 ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: biocom-api-logging
  namespace: biocom-api
  labels:
    app: biocom-api
    component: logging
data:
  logging.json: |
    {
      "level": "debug",
      "format": "json",
      "timestamp": true,
      "colorize": false,
      "metadata": true,
      "fields": {
        "service": "biocom-api",
        "environment": "dev",
        "version": "1.0.0"
      }
    }
