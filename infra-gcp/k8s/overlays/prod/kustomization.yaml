# Prod Environment Kustomization - biocom-bo-api 운영 환경

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 네임스페이스 지정
namespace: biocom-bo-api

# Base 리소스 참조
resources:
  - ../../base
  - configmap.yaml
  - ingress.yaml

# 이미지 태그 (배포 시 동적으로 변경됨)
images:
  - name: biocom-bo-api
    newName: asia-northeast3-docker.pkg.dev/api-prod-biocom/biocom-api/biocom-bo-api
    newTag: "20260129011651"

# 환경별 레이블
commonLabels:
  environment: prod

# 환경별 어노테이션
commonAnnotations:
  environment: prod

# 운영 환경 patches
# 6명 백오피스 사용자 기준 최적화 (2026-02-03)
patches:
  # Deployment - replicas, strategy (리소스는 base 그대로 사용)
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/strategy/rollingUpdate/maxSurge
        value: 1
      - op: replace
        path: /spec/strategy/rollingUpdate/maxUnavailable
        value: 0
    target:
      kind: Deployment
      name: biocom-bo-api

  # HPA - minReplicas, maxReplicas (6명 사용자 기준 최소화)
  - patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
    target:
      kind: HorizontalPodAutoscaler
      name: biocom-bo-api-hpa

  # ServiceAccount - Workload Identity (운영)
  - patch: |-
      - op: add
        path: /metadata/annotations
        value:
          iam.gke.io/gcp-service-account: biocom-bo-api@api-prod-biocom.iam.gserviceaccount.com
    target:
      kind: ServiceAccount
      name: biocom-bo-api-sa
