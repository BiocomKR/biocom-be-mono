# 🌐 Service - biocom-mq Worker 네트워크 서비스 정의
# Worker는 내부 서비스로만 사용 (Ingress 불필요)

apiVersion: v1
kind: Service
metadata:
  name: biocom-mq-service
  namespace: biocom-api
  labels:
    app: biocom-mq
    service: biocom-mq
spec:
  type: ClusterIP  # 클러스터 내부에서만 접근

  # 포트 설정
  ports:
  - name: http
    port: 20804
    targetPort: 20804
    protocol: TCP

  # Pod 선택자
  selector:
    app: biocom-mq
