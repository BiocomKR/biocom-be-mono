# 🌐 Service - 네트워크 서비스 정의
# AWS EKS Service와 동일한 기능

apiVersion: v1
kind: Service
metadata:
  name: biocom-api-service
  namespace: biocom-api
  labels:
    app: biocom-api
    service: biocom-api
  annotations:
    # GCP Load Balancer 설정을 위한 어노테이션
    cloud.google.com/neg: '{"ingress": true}'  # NEG (Network Endpoint Group) 활성화
    cloud.google.com/backend-config: '{"default": "biocom-api-backend-config"}'
    
    # 서비스 메타데이터
    service.alpha.kubernetes.io/tolerate-unready-endpoints: "true"
spec:
  type: ClusterIP  # 클러스터 내부에서만 접근 (Ingress를 통해 외부 노출)
  
  # 포트 설정
  ports:
  - name: http
    port: 80        # 서비스 포트
    targetPort: 10804  # Pod 포트
    protocol: TCP
  
  # Pod 선택자
  selector:
    app: biocom-api

---
# ⚙️ BackendConfig - GCP Load Balancer 세부 설정
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: biocom-api-backend-config
  namespace: biocom-api
spec:
  # 헬스체크 설정
  healthCheck:
    checkIntervalSec: 10    # 헬스체크 간격
    timeoutSec: 5           # 타임아웃
    healthyThreshold: 2     # 정상 판정 임계값
    unhealthyThreshold: 3   # 비정상 판정 임계값
    type: HTTP
    requestPath: /api/health    # 헬스체크 경로
    port: 10804
  
  # 타임아웃 설정
  timeoutSec: 30            # 백엔드 타임아웃
  
  # 연결 드레이닝 설정 (Pod 종료 시 기존 연결 유지)
  connectionDraining:
    drainingTimeoutSec: 60
  
  # 세션 어피니티 (필요한 경우)
  sessionAffinity:
    affinityType: "NONE"    # "CLIENT_IP", "GENERATED_COOKIE", "NONE"
    affinityCookieTtlSec: 86400
  
  # 보안 정책 (Cloud Armor - 필요한 경우)
  # securityPolicy:
  #   name: "biocom-security-policy"
  
  # 로깅 설정
  logging:
    enable: true
    sampleRate: 1.0         # 100% 로깅 (개발환경)
  
  # Rate Limiting 설정 (중요: 기본값 1 RPS는 너무 낮음)
  customRequestHeaders:
    # 커스텀 헤더 추가 가능
  
  # 백엔드 서비스 설정 (더 많은 트래픽 허용)
  # 기본 maxRatePerEndpoint: 1.0을 더 높은 값으로 오버라이드하기 위해
  # iap 설정을 통해 간접적으로 백엔드 설정을 조정

---
# 🔄 Headless Service - StatefulSet이나 특별한 DNS 요구사항이 있는 경우
apiVersion: v1
kind: Service
metadata:
  name: biocom-api-headless
  namespace: biocom-api
  labels:
    app: biocom-api
    service: biocom-api-headless
spec:
  type: ClusterIP
  clusterIP: None  # Headless 서비스
  
  ports:
  - name: http
    port: 10804
    targetPort: 10804
    protocol: TCP
  
  selector:
    app: biocom-api

