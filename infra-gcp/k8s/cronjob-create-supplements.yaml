# 🕐 CronJob - 영양제 주간 생성 배치
# 매주 월요일 00:10 KST에 실행

apiVersion: batch/v1
kind: CronJob
metadata:
  name: create-weekly-supplements
  namespace: biocom-api
  labels:
    app: biocom-api
    job-type: create-weekly-supplements
spec:
  # Cron 표현식 (UTC 기준 - KST 00:10 = UTC 15:10, 월요일)
  # KST 00:10 월요일 = UTC 15:10 일요일
  schedule: "10 15 * * 0"

  # 성공한 Job 히스토리 보관 개수
  successfulJobsHistoryLimit: 3

  # 실패한 Job 히스토리 보관 개수
  failedJobsHistoryLimit: 3

  # 동시 실행 정책
  concurrencyPolicy: Forbid

  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600

      template:
        metadata:
          labels:
            app: biocom-api
            job-type: create-weekly-supplements
        spec:
          serviceAccountName: biocom-api-sa

          imagePullSecrets:
          - name: gcr-json-key

          restartPolicy: Never

          containers:
          - name: create-weekly-supplements
            image: asia-northeast3-docker.pkg.dev/api-prod-biocom/biocom-api/biocom-api:prod-20251223151022
            imagePullPolicy: Always

            command:
            - node
            - dist/src/main.js
            - --run-scheduler
            - create-weekly-supplements

            envFrom:
            - configMapRef:
                name: biocom-api-config
            - secretRef:
                name: biocom-api-secrets

            volumeMounts:
            - name: logs
              mountPath: /app/logs
            - name: kcp-cert-files
              mountPath: /config/kcp-cert
            - name: firebase-service-account-key
              mountPath: /app/firebase
              readOnly: true
              readOnly: true

            resources:
              requests:
                memory: "512Mi"
                cpu: "250m"
              limits:
                memory: "1Gi"
                cpu: "500m"

          volumes:
          - name: logs
            emptyDir: {}
          - name: kcp-cert-files
            secret:
              secretName: kcp-cert-files
          - name: firebase-service-account-key
            secret:
              secretName: firebase-service-account-key
