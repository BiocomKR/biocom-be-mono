# 🕐 CronJob - 푸시 스케줄 확인 배치
# 매분 실행 (UTC 기준)

apiVersion: batch/v1
kind: CronJob
metadata:
  name: check-push-schedules
  namespace: biocom-api
  labels:
    app: biocom-api
    job-type: check-push-schedules
spec:
  # Cron 표현식 (매분 실행)
  # 분 시 일 월 요일
  schedule: "* * * * *"

  # 성공한 Job 히스토리 보관 개수
  successfulJobsHistoryLimit: 3

  # 실패한 Job 히스토리 보관 개수
  failedJobsHistoryLimit: 3

  # 동시 실행 정책 (Forbid: 이전 작업이 끝나기 전까지 새 작업 시작 안 함)
  # 멀티 팟 환경에서 Race Condition 방지
  concurrencyPolicy: Forbid

  # 스케줄 시작 데드라인 (초) - 200초 내에 시작되지 않으면 스킵
  startingDeadlineSeconds: 200

  jobTemplate:
    spec:
      # Job 완료 후 Pod 삭제까지 대기 시간 (초)
      ttlSecondsAfterFinished: 120

      # Job 실패 시 재시도 횟수
      backoffLimit: 1

      # Job 실행 시간 제한 (초) - 60초 내에 완료되어야 함
      activeDeadlineSeconds: 60

      template:
        metadata:
          labels:
            app: biocom-api
            job-type: check-push-schedules
        spec:
          # 서비스 계정
          serviceAccountName: biocom-api-sa

          # 이미지 Pull Secret
          imagePullSecrets:
          - name: gcr-json-key

          # Job 실패 시 재시작하지 않음
          restartPolicy: Never

          containers:
          - name: check-push-schedules
            image: asia-northeast3-docker.pkg.dev/api-dev-biocom/biocom-api/biocom-api:latest
            imagePullPolicy: Always

            # 배치 실행 명령어
            command:
            - node
            - dist/src/main.js
            - --run-scheduler
            - check-push-schedules

            # 환경변수는 ConfigMap + Secret에서 가져옴
            envFrom:
            - configMapRef:
                name: biocom-api-config
            - secretRef:
                name: biocom-api-secrets

            # 볼륨 마운트 (Firebase 키 + 로그 디렉토리 + KCP 인증서)
            volumeMounts:
            - name: firebase-service-account-key
              mountPath: /app/firebase
              readOnly: true
            - name: logs
              mountPath: /app/logs
            - name: kcp-cert-files
              mountPath: /config/kcp-cert
              readOnly: true

            # 리소스 제한 (매분 실행이므로 가볍게)
            resources:
              requests:
                memory: "256Mi"
                cpu: "100m"
              limits:
                memory: "512Mi"
                cpu: "250m"

          # 볼륨 정의
          volumes:
          - name: firebase-service-account-key
            secret:
              secretName: firebase-service-account-key
          - name: logs
            emptyDir: {}
          - name: kcp-cert-files
            secret:
              secretName: kcp-cert-files
